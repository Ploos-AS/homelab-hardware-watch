[project]
name = "homelab-hardware-watch"
version = "0.1.0"
description = "Configuration-driven homelab hardware sourcing watch"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hhw = "hhw.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
